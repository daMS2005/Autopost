[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data", "output", "videos", ".venv", "voice_lab.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "PIE", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
